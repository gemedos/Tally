<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Tally</title>
<style>
:root{--bg:#0E0F12;--card:#17191F;--line:#262932;--fg:#F2F3F5;--mu:#8B90A0;--ac:#C6F432;--acfg:#111;--bad:#FF5A5A;--good:#4ADE80}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,Roboto,sans-serif}
#app{max-width:560px;margin:0 auto;padding:12px 16px 96px}
header{display:flex;align-items:center;gap:10px;margin:6px 0 14px}
header h1{font-size:26px;margin:0;flex:1}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:22px 0 8px}
.muted{color:var(--mu)}.small{font-size:13px}.center{text-align:center;margin-top:28px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-width:0}
input:focus,select:focus{outline:none;border-color:var(--ac)}
label{font-size:12px;color:var(--mu);display:block}label input{margin-top:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}
.row{display:flex;align-items:center;gap:8px;justify-content:space-between}
.row>span{flex:1}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.btn{display:block;width:100%;background:var(--ac);color:var(--acfg);font-weight:700;border-radius:12px;padding:13px;margin:8px 0}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.danger{color:var(--bad)}.btn.sm{width:auto;padding:10px 14px;margin:0}
.icon{width:38px;height:38px;border-radius:10px;font-size:18px;flex:none;color:var(--mu)}
.icon:active{background:var(--line)}
.check{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:8px 0}
.check span:nth-child(2){flex:1}
.box{width:26px;height:26px;border-radius:8px;border:2px solid var(--mu);display:grid;place-items:center;font-weight:900;color:var(--acfg)}
.check.on .box{background:var(--ac);border-color:var(--ac)}.check.on{border-color:var(--ac)}
.streak{font-size:13px;color:var(--mu)}
.train{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;min-height:240px;background:var(--ac);color:var(--acfg);border-radius:24px;padding:24px 16px;margin:14px 0 6px;text-align:center;transition:transform .15s}
.train:active{transform:scale(.98)}
.train b{display:block;font-size:30px;font-weight:900;letter-spacing:-.01em}.train small{opacity:.7;font-size:14px;margin-top:2px}
.playbig{width:104px;height:104px;border-radius:50%;background:#111;display:grid;place-items:center;margin-bottom:16px;animation:breathe 2.4s infinite}
.playbig svg{width:46px;height:46px;fill:var(--ac);margin-left:6px}
@keyframes breathe{0%{box-shadow:0 0 0 0 #1117}70%{box-shadow:0 0 0 22px #1110}100%{box-shadow:0 0 0 0 #1110}}
.train.pressed .playbig{animation:popb .35s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes popb{35%{transform:scale(.82)}100%{transform:scale(1.35)}}
#burst{position:fixed;inset:0;z-index:20;pointer-events:none;background:#111;clip-path:circle(0 at var(--x) var(--y));transition:clip-path .45s cubic-bezier(.7,0,.3,1),opacity .3s ease-out}
#burst.go{clip-path:circle(150vmax at var(--x) var(--y))}
#burst.out{opacity:0}
#app.enter{animation:enter .4s cubic-bezier(.2,.8,.3,1)}
@keyframes enter{from{opacity:0;transform:translateY(28px) scale(.97)}}
.chart svg{width:100%;height:auto;margin-top:6px;overflow:visible}
.chart polyline{fill:none;stroke:var(--ac);stroke-width:2;stroke-linejoin:round}
.chart circle{fill:var(--ac)}
.up{color:var(--good)}.down{color:var(--bad)}
.item{display:block;width:100%;text-align:left}.item small{display:block}
.days{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:14px;color:var(--mu)}
.chip.on{background:var(--ac);border-color:var(--ac);color:var(--acfg);font-weight:600}
input.big{font-size:20px;font-weight:600;padding:12px}
.ex .row input{font-weight:600}
.link{display:block;margin:-4px auto;font-size:12px;color:var(--mu);border:1px dashed var(--line);border-radius:999px;padding:4px 12px;position:relative;z-index:1;background:var(--bg)}
.link.on{color:var(--acfg);background:var(--ac);border:1px solid var(--ac);font-weight:700}
.ex.linked,.gx.ss{border-left:3px solid var(--ac)}
.gx.cur{border-color:var(--ac)}.gx.fin{opacity:.55}.gx.fin.cur{opacity:1}
.gx.ss:not(.ssBot){margin-bottom:0;border-bottom-left-radius:0;border-bottom-right-radius:0}
.gx.ss:not(.ssTop){margin-top:0;border-top-left-radius:0;border-top-right-radius:0;border-top-style:dashed}
.tag{font-size:10px;font-weight:800;background:var(--ac);color:var(--acfg);border-radius:4px;padding:1px 5px;vertical-align:middle}
.play{width:46px;height:46px;border-radius:50%;background:var(--ac);color:var(--acfg);font-size:18px;flex:none}
.gx.fin .play{background:var(--line);color:var(--fg)}
.sets{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.dot{min-width:30px;height:26px;padding:0 8px;border-radius:999px;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--mu)}
.dot.on{background:#26301a;border-color:var(--ac);color:var(--ac)}
.act{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.act input{font-size:22px;font-weight:700;text-align:center}
#nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#15171C;border-top:1px solid var(--line)}
#nav button{flex:1;padding:12px 0 14px;font-size:13px;color:var(--mu)}
#nav button.on{color:var(--ac);font-weight:700}
#nav svg{display:block;margin:0 auto 2px;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#rest{position:fixed;left:0;right:0;bottom:0;background:#15171C;border-top:2px solid var(--ac);border-radius:20px 20px 0 0;padding:18px 16px 22px;text-align:center;box-shadow:0 -10px 40px #000a}
#rest>*{max-width:528px;margin-left:auto;margin-right:auto}
#clock{font-size:64px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1;color:var(--ac)}
.chip.mini{padding:4px 10px;font-size:12px}
.step{display:grid;grid-template-columns:64px 1fr 64px;gap:8px;align-items:center;margin:10px 0}
.step>button{height:64px;border-radius:16px;background:var(--line);font-size:30px;font-weight:700}
.step>button:active{background:var(--ac);color:var(--acfg)}
.step label{position:relative;margin:0}
.step input{margin:0;height:64px;font-size:30px;font-weight:800;text-align:center;padding:0 34px 0 8px}
.step small{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--mu);font-size:13px}
.steps{justify-content:center;margin:-2px 0 4px}
.prhint{text-align:center;color:#FFC93C;font-weight:700;font-size:14px;margin:4px 0;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.45}}
.dot.pr{border-color:#FFC93C;color:#FFC93C;background:#33290f}
#pr{position:fixed;inset:0;background:#000000f0;display:grid;place-items:center;z-index:10}
.prbox{text-align:center;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.trophy{font-size:96px;line-height:1;animation:spin 1s ease-out}
.prt{font-size:40px;font-weight:900;letter-spacing:.06em;color:#FFC93C;margin:8px 0 4px}
.prv{font-size:30px;font-weight:800;color:var(--ac);margin:6px 0 18px}
@keyframes pop{from{transform:scale(.3);opacity:0}}
@keyframes spin{from{transform:rotate(-200deg) scale(.2)}}
.champ{display:flex;align-items:center;gap:12px;background:#1f2614;border:1px solid #3a4a1a;border-radius:12px;padding:10px 12px;margin:4px 0 6px}
.champ>span{font-size:28px}.champ>div{flex:1;min-width:0}.champ small{display:block}
.champ b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.champ>b{font-size:20px}
.bar{display:grid;grid-template-columns:42% 1fr auto;gap:8px;align-items:center;margin-top:8px;font-size:13px}
.bar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar i{display:block;height:8px;border-radius:4px;background:var(--ac)}
.hset{display:grid;grid-template-columns:34px 1fr 1fr 38px;gap:8px;align-items:center;margin-top:8px}
.hset label{position:relative;margin:0}.hset input{margin:0;padding-right:40px}
.hset small{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--mu);font-size:12px}
input[type=date]{color-scheme:dark}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav">
  <button data-go="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10H3z"/></svg>Home</button>
  <button data-go="routines"><svg viewBox="0 0 24 24"><path d="M2 9v6M6 6v12M18 6v12M22 9v6M6 12h12"/></svg>Routines</button>
  <button data-go="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>Settings</button>
</nav>
<div id="rest" hidden></div>
<div id="pr" data-act="prClose" hidden></div>
<div id="burst" hidden></div>
<input type="file" id="file" accept=".json,application/json" hidden>
<script>
'use strict';
const $ = s => document.querySelector(s);
const A = window.Android;
const KEY = 'tally';
const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], ORDER = [1, 2, 3, 4, 5, 6, 0];
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const dkey = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? 0 : n; };
const fmt = n => Math.round(n * 100) / 100;

const defaults = () => ({v: 1, checks: [{id: 'creatine', name: 'Took creatine today?'}], log: {}, charts: [{type: 'volume'}], routines: [], history: [], rest: 90, unit: 'kg', active: null});
let S;
try { S = Object.assign(defaults(), JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) { S = defaults(); }
const save = () => localStorage.setItem(KEY, JSON.stringify(S));
function migrate() { // v2: add the "Biggest gains" chart once
  if ((S.v || 1) < 2) { if (!S.charts.some(c => c.type === 'progress')) S.charts.unshift({type: 'progress', p: 91}); S.v = 2; save(); }
}
migrate();

let view = 'home', edit = null;
const U = () => S.unit === 'lb' ? 'lb' : 'kg';

function go(v) { view = v; scrollTo(0, 0); render(); }
function render() {
  $('#nav').hidden = ['gym', 'edit', 'history', 'hedit'].includes(view);
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.go === view));
  $('#app').innerHTML = ({home: Home, routines: Routines, edit: Editor, gym: Gym, settings: Settings, history: History, hedit: HEdit})[view]();
  if (A) A.keepScreenOn(view === 'gym');
  renderRest();
  prCheck();
}

/* ---------- Home ---------- */
const todayRoutine = () => S.routines.find(r => r.kind === 'day' && r.days.includes(new Date().getDay()));
const todayMinis = () => S.routines.filter(r => r.kind === 'mini' && r.days.includes(new Date().getDay()));
function streak(id) {
  let n = 0; const d = new Date();
  if (!(S.log[dkey(d)] || {})[id]) d.setDate(d.getDate() - 1);
  while ((S.log[dkey(d)] || {})[id]) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function Home() {
  const t = dkey(), r = todayRoutine(), m = todayMinis();
  let h = `<header><h1>Tally</h1><span class="muted small">${new Date().toLocaleDateString('en-GB', {weekday: 'long', day: 'numeric', month: 'short'})}</span></header>`;
  h += S.checks.map(c => {
    const on = (S.log[t] || {})[c.id], st = streak(c.id);
    return `<button class="check ${on ? 'on' : ''}" data-act="check" data-id="${c.id}"><span class="box">${on ? '✓' : ''}</span><span>${esc(c.name)}</span>${st > 1 ? `<span class="streak">🔥 ${st}</span>` : ''}</button>`;
  }).join('');
  const names = [r, ...m].filter(Boolean).map(x => esc(x.name)).join(' + ');
  const sub = S.active ? 'Workout in progress' : names || (S.routines.length ? 'Nothing scheduled today · pick one' : 'Create your first routine');
  h += `<button class="train" data-act="train"><span class="playbig"><svg viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z"/></svg></span><b>${S.active ? 'Resume workout' : "Let's train"}</b><small>${sub}</small></button>`;
  return h + S.charts.map((c, i) => c.type === 'progress' ? progressCard(c, i) : chartCard(c)).join('');
}
/* Estimated 1-rep max (Epley); bodyweight sets (0 weight) are scored by reps */
const e1 = s => s.w > 0 ? s.w * (1 + s.r / 30) : s.r;
const PERIODS = [[28, '4W'], [91, '3M'], [182, '6M'], [365, '1Y'], [0, 'All']];
function gains(days) {
  const from = days ? dkey(new Date(Date.now() - days * 864e5)) : '', by = {};
  S.history.filter(h => h.d >= from).forEach(h => h.ex.forEach(e => {
    if (!e.sets.length) return;
    const k = e.n.trim().toLowerCase();
    (by[k] = by[k] || {n: e.n, v: []}).v.push(Math.max(...e.sets.map(e1)));
  }));
  return Object.values(by).filter(x => x.v.length > 1 && x.v[0] > 0).map(x => {
    const best = Math.max(...x.v.slice(1));
    return {n: x.n, g: (best - x.v[0]) / x.v[0] * 100};
  }).filter(x => x.g > 0).sort((p, q) => q.g - p.g).slice(0, 5);
}
function progressCard(c, i) {
  const p = c.p == null ? 91 : c.p, g = gains(p), top = g[0];
  let h = `<div class="card chart"><div class="row"><span class="small muted">Biggest gains</span></div>
  <div class="days">${PERIODS.map(([d, l]) => `<button class="chip mini ${d === p ? 'on' : ''}" data-act="period" data-i="${i}" data-p="${d}">${l}</button>`).join('')}</div>`;
  if (!top) return h + '<div class="muted small">Not enough data yet. Log the same exercise in at least two workouts in this period.</div></div>';
  h += `<div class="champ"><span>🏆</span><div><small class="muted">Most progress</small><b>${esc(top.n)}</b></div><b class="up">+${Math.round(top.g)}%</b></div>`;
  h += g.slice(1).map(x => `<div class="bar"><span>${esc(x.n)}</span><i style="width:${Math.max(4, x.g / top.g * 100)}%"></i><b class="up">+${Math.round(x.g)}%</b></div>`).join('');
  return h + '<div class="muted small" style="margin-top:8px">Estimated 1-rep max: first vs best workout in the period</div></div>';
}
function series(c) {
  const hs = S.history.slice(-30);
  if (c.type === 'volume') return hs.map(s => s.ex.reduce((a, e) => a + e.sets.reduce((b, x) => b + x.w * x.r, 0), 0));
  const out = [];
  hs.forEach(s => {
    const e = s.ex.find(e => e.n.toLowerCase() === c.ex.toLowerCase());
    if (e && e.sets.length) out.push(c.m === 'reps' ? e.sets.reduce((a, x) => a + x.r, 0) : Math.max(...e.sets.map(x => x.w)));
  });
  return out;
}
const chartTitle = c => c.type === 'progress' ? 'Biggest gains' : c.type === 'volume' ? `Total volume per workout (${U()})` : esc(c.ex) + ' · ' + (c.m === 'reps' ? 'total reps' : `top weight (${U()})`);
function chartCard(c) {
  const v = series(c);
  let body = '<div class="muted small">No data yet — finish a workout</div>';
  if (v.length) {
    const W = 300, H = 70, p = 4, mx = Math.max(...v), mn = Math.min(...v), rg = mx - mn || 1;
    const pts = v.map((y, i) => [v.length === 1 ? W / 2 : p + i * (W - 2 * p) / (v.length - 1), mx === mn ? H / 2 : H - p - (y - mn) / rg * (H - 2 * p)]);
    body = `<svg viewBox="0 0 ${W} ${H}"><polyline points="${pts.map(q => q.join(',')).join(' ')}"/>${pts.map(q => `<circle cx="${q[0]}" cy="${q[1]}" r="3"/>`).join('')}</svg>`;
  }
  const last = v.length ? fmt(v[v.length - 1]) : '–', d = v.length > 1 ? fmt(v[v.length - 1] - v[v.length - 2]) : 0;
  return `<div class="card chart"><div class="row"><span class="small muted">${chartTitle(c)}</span><b>${last}${d ? ` <small class="${d > 0 ? 'up' : 'down'}">${d > 0 ? '+' : ''}${d}</small>` : ''}</b></div>${body}</div>`;
}

/* ---------- Routines ---------- */
function Routines() {
  const list = k => S.routines.filter(r => r.kind === k).map(r =>
    `<button class="card item" data-act="editR" data-id="${r.id}"><b>${esc(r.name)}</b><small class="muted">${ORDER.filter(d => r.days.includes(d)).map(d => DAYS[d]).join(' · ') || 'No day assigned'} · ${r.items.length} exercise${r.items.length === 1 ? '' : 's'}</small></button>`
  ).join('') || '<p class="muted small">None yet</p>';
  return `<header><h1>Routines</h1></header>
  <h2>Training days</h2>${list('day')}<button class="btn ghost" data-act="newR" data-kind="day">+ New routine</button>
  <h2>Mini routines</h2><p class="muted small">Short add-ons (e.g. Abs) that get added to your workout on the days you pick.</p>${list('mini')}<button class="btn ghost" data-act="newR" data-kind="mini">+ New mini routine</button>`;
}
function Editor() {
  const r = edit, n = r.items.length;
  let h = `<header><button class="icon" data-act="back">←</button><h1>${r.kind === 'mini' ? 'Mini routine' : 'Routine'}</h1></header>
  <input class="big" placeholder="${r.kind === 'mini' ? 'Name (e.g. Abs)' : 'Name (e.g. Push day)'}" value="${esc(r.name)}" data-f="name">
  <div class="days">${ORDER.map(d => `<button class="chip ${r.days.includes(d) ? 'on' : ''}" data-act="day" data-d="${d}">${DAYS[d]}</button>`).join('')}</div>`;
  h += r.items.map((it, i) => `<div class="card ex ${it.ss || (i && r.items[i - 1].ss) ? 'linked' : ''}">
    <div class="row"><input placeholder="Exercise name" value="${esc(it.name)}" data-i="${i}" data-k="name">
    <button class="icon" data-act="mv" data-i="${i}" data-d="-1">↑</button><button class="icon" data-act="mv" data-i="${i}" data-d="1">↓</button><button class="icon" data-act="del" data-i="${i}">✕</button></div>
    <div class="grid"><label>Sets<input inputmode="numeric" value="${esc(it.sets)}" data-i="${i}" data-k="sets"></label><label>Reps<input value="${esc(it.reps)}" data-i="${i}" data-k="reps"></label><label>${U()}<input inputmode="decimal" value="${esc(it.weight)}" data-i="${i}" data-k="weight"></label><label>Rest (s)<input inputmode="numeric" value="${esc(it.rest)}" data-i="${i}" data-k="rest"></label></div>
  </div>${i < n - 1 ? `<button class="link ${it.ss ? 'on' : ''}" data-act="ss" data-i="${i}">${it.ss ? '⛓ Superset' : '+ superset with next'}</button>` : ''}`).join('');
  h += `<button class="btn ghost" data-act="addEx">+ Add exercise</button><button class="btn" data-act="saveR">Save</button>`;
  if (S.routines.some(x => x.id === r.id)) h += `<button class="btn ghost danger" data-act="delR">Delete</button>`;
  return h;
}
function commitEdit() {
  const r = edit;
  r.name = r.name.trim() || (r.kind === 'mini' ? 'Mini routine' : 'Routine');
  r.items = r.items.filter(it => String(it.name).trim()).map(it => ({
    id: it.id, name: String(it.name).trim(), sets: Math.max(1, parseInt(it.sets) || 1), reps: String(it.reps).trim() || '10',
    weight: num(it.weight), rest: Math.max(0, parseInt(it.rest) || 0), ss: !!it.ss
  }));
  if (r.items.length) r.items[r.items.length - 1].ss = false;
  const i = S.routines.findIndex(x => x.id === r.id);
  if (i >= 0) S.routines[i] = r; else S.routines.push(r);
  save(); edit = null; go('routines');
}

/* ---------- Gym mode ---------- */
const need = it => it.done.length < (+it.sets || 1);
function group(items, i) { let a = i, b = i; while (a > 0 && items[a - 1].ss) a--; while (items[b].ss && b < items.length - 1) b++; return [a, b]; }
function buildWorkout(rid, minis, old) {
  const prev = {}; (old || []).forEach(it => prev[it.rid + '/' + it.id] = it.done);
  const items = [];
  [rid, ...minis].forEach(id => {
    const r = S.routines.find(x => x.id === id); if (!r) return;

    S.history.forEach(h => h.ex.forEach(e => e.sets.forEach(s => s.w = cv(s.w))));
    if (S.active) S.active.items.forEach(it => { it.weight = cv(it.weight); it.done.forEach(s => s.w = cv(s.w)); });
    S.unit = d.u; save(); render();
  },
  reset() { if (confirm('Delete ALL data? This cannot be undone. Export a backup first if unsure.')) { S = defaults(); save(); go('home'); } },
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-go]');
  if (!t) return;
  if (t.dataset.go) return go(t.dataset.go);
  const f = H[t.dataset.act]; if (f) f(t.dataset, t);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'w' || t.id === 'r') prCheck();
  if (view === 'hedit' && hed) {
    if (t.dataset.hf) hed.w[t.dataset.hf] = t.value;
    else if (t.dataset.s != null) hed.w.ex[+t.dataset.e].sets[+t.dataset.s][t.dataset.k] = t.value;
    else if (t.dataset.e != null) hed.w.ex[+t.dataset.e].n = t.value;
  }
  if (view === 'edit' && edit) {
    if (t.dataset.f === 'name') edit.name = t.value;
    else if (t.dataset.k) edit.items[+t.dataset.i][t.dataset.k] = t.value;
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'pickR') { const W = S.active; W.rid = t.value || null; W.items = buildWorkout(W.rid, W.minis, W.items); W.cur = null; save(); render(); }
  if (t.id === 'defRest') { S.rest = Math.max(0, parseInt(t.value) || 0); save(); }
});
window.onBack = () => {
  if (view === 'edit') { commitEdit(); return true; }
  if (view === 'hedit') { saveHistory(); return true; }
  if (view === 'history') { go('settings'); return true; }
  if (view !== 'home') { go('home'); return true; }
  return false;
};
window.onResume = () => { if (view === 'home') render(); else tick(); };
render();
</script>
</body>
</html>
